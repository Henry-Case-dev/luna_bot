services:
  # Loki для хранения логов
  loki:
    build:
      context: ./monitoring/loki
    container_name: luna_bot-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
    networks:
      - monitoring

  # Promtail для сбора логов
  promtail:
    build:
      context: ./monitoring/promtail
    container_name: luna_bot-promtail
    volumes:
      - bot-logs:/var/log/luna_bot:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring

  # Grafana для просмотра логов
  grafana:
    build:
      context: ./monitoring/grafana
    container_name: luna_bot-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://henry-case-dev-luna_bot-3624.twc1.net/
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring

volumes:
  loki-data:
  grafana-data:
  # bot-logs volume должен быть внешним, чтобы promtail мог читать логи основного бота
  bot-logs:
    external: true

networks:
  monitoring:
    driver: bridge
