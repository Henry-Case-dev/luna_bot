services:
  # Loki для хранения логов
  loki:
    build:
      context: ./monitoring/loki
    container_name: luna_bot-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: /usr/local/bin/loki -config.file=/etc/loki/config.yml
    restart: unless-stopped
    networks:
      - monitoring

  # Promtail для сбора логов
  promtail:
    build:
      context: ./monitoring/promtail
    container_name: luna_bot-promtail
    volumes:
      - bot-logs:/var/log/luna_bot:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: /usr/local/bin/promtail -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring

  # Grafana для просмотра логов
  grafana:
    build:
      context: ./monitoring/grafana
    container_name: luna_bot-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - monitoring

volumes:
  loki-data:
  grafana-data:
  # bot-logs volume должен быть внешним, чтобы promtail мог читать логи основного бота
  bot-logs:
    external: true
    name: luna_bot_bot-logs

networks:
  monitoring:
    driver: bridge
