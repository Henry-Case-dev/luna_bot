services:
  # Основное приложение бота
  luna_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luna_bot-bot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PRODUCTION=true
      - DOCKER=true
      - NGINX_MODE=false
      - FREE_WILL_ENABLED=true
      - POSTGRESQL_HOST=db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_SSLMODE=disable
      - STORAGE_TYPE=postgres
      - POSTGRESQL_USER=${POSTGRESQL_USER}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRESQL_DBNAME=${POSTGRESQL_DBNAME}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEY_RESERVE=${GEMINI_API_KEY_RESERVE}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY}
      - GOOGLE_SEARCH_ENGINE_ID=${GOOGLE_SEARCH_ENGINE_ID}
    volumes:
      - bot-logs:/var/log/luna_bot
      - ./data:/app/data
      - ./configs/luna_bot.yaml:/app/configs/luna_bot.yaml:ro
      - ./internal/bot/prompts:/app/internal/bot/prompts:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot-network

  # PostgreSQL 16 с расширением pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: luna_bot-db
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DBNAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER} -d ${POSTGRESQL_DBNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - bot-network

volumes:
  bot-logs:
  pgdata:

networks:
  bot-network:
    driver: bridge
