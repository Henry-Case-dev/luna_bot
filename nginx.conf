events {
    worker_connections 1024;
}

http {
    upstream bot {
        server 127.0.0.1:8080;
    }
    
    upstream grafana {
        server 127.0.0.1:3000;
    }
    
    upstream loki {
        server 127.0.0.1:3100;
    }
    
    upstream promtail {
        server 127.0.0.1:9080;
    }
    
    server {
        listen 80;
        
        # Редирект без завершающего слэша
        location = /grafana {
            return 301 /grafana/;
        }

        # Основное приложение бота
        location / {
            proxy_pass http://bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Статус сервисов для диагностики
        location /status {
            proxy_pass http://bot/status;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Grafana через /grafana
        location /grafana/ {
            # Со слэшем: автоматически срезает префикс /grafana/
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /grafana;
            
            # Нужно для корректной работы Grafana с подпутями
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            
            # WebSocket support для live обновлений
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Убираем trailing slash проблемы
            proxy_redirect off;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }
        
        # Loki API через /loki
        location /loki/ {
            proxy_pass http://loki/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_set_header X-Scope-OrgID 1;
        }
        
        # Promtail status через /promtail
        location /promtail/ {
            proxy_pass http://promtail/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Простая диагностика nginx
        location /nginx-status {
            return 200 "nginx is running\n";
            add_header Content-Type text/plain;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Редирект без завершающего слэша
        location = /grafana {
            return 301 /grafana/;
        }

        # Основное приложение бота
        location / {
            proxy_pass http://bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Статус сервисов для диагностики
        location /status {
            proxy_pass http://bot/status;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Grafana через /grafana
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /grafana;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        # Loki API через /loki
        location /loki/ {
            proxy_pass http://loki/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_set_header X-Scope-OrgID 1;
        }

        # Promtail status через /promtail
        location /promtail/ {
            proxy_pass http://promtail/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Простая диагностика nginx
        location /nginx-status {
            return 200 "nginx is running\n";
            add_header Content-Type text/plain;
        }
    }
}
