# =============================================================================
# Luna Bot — YAML Configuration
# =============================================================================
# Основной файл конфигурации. Секреты (API-ключи) задаются через переменные
# окружения с синтаксисом ${ENV_VAR} или через внешний secret-файл.
# Переопределение через переменные окружения:
#   LUNA_LLM__PROVIDERS__GEMINI__API_KEY=sk-xxx
# =============================================================================

# -----------------------------------------------------------------------------
# llm — LLM-провайдеры и роутинг
# -----------------------------------------------------------------------------
llm:
  # Основной провайдер по умолчанию (gemini | deepseek | openrouter)
  # Тип: string, По умолчанию: "gemini"
  default_provider: "gemini"

  # Включить fallback на резервного провайдера при ошибках 429/5xx
  # Тип: bool, По умолчанию: true
  fallback_enabled: true

  # Типы ответов, для которых разрешён fallback (критические пути)
  # Тип: []string, По умолчанию: ["free_will_silence", "free_will_reaction"]
  fallback_critical_types:
    - "free_will_silence"
    - "free_will_reaction"
    - "free_will_direct"
    - "free_will_general"
    - "free_will_context"

  # Порядок провайдеров для fallback (по убыванию приоритета)
  # Тип: []string, По умолчанию: ["gemini", "deepseek", "openrouter"]
  fallback_provider_order:
    - "gemini"
    - "deepseek"
    - "openrouter"

  # Circuit Breaker: защита от каскадных отказов
  circuit_breaker:
    # Максимальное число последовательных ошибок до размыкания
    # Тип: int, По умолчанию: 5
    max_failures: 5
    # Время остывания (сек) перед попыткой восстановления
    # Тип: int, По умолчанию: 60
    cooldown_seconds: 60

  # ------------------------------------------------------------------------
  # providers — конфигурация каждого LLM-провайдера
  # ------------------------------------------------------------------------
  providers:
    # --- Gemini ---
    gemini:
      # Включён ли провайдер
      # Тип: bool, По умолчанию: true
      enabled: true
      # Основной API-ключ (из переменной окружения)
      # Тип: string (secret)
      api_key: "${GEMINI_API_KEY}"
      # Резервный API-ключ для ротации
      # Тип: string (secret)
      reserve_api_key: "${GEMINI_API_KEY_RESERVE}"
      # Интервал ротации ключей (часы)
      # Тип: int, По умолчанию: 1
      key_rotation_hours: 1
      # Базовый URL API (пустая строка — стандартный)
      # Тип: string, По умолчанию: ""
      base_url: ""
      # Настройки безопасности (Gemini-specific)
      safety:
        # Отключать встроенные фильтры безопасности Gemini
        # Тип: bool, По умолчанию: true
        bypass_filters: true
        # Применять обфускацию промптов для обхода фильтров
        # Тип: bool, По умолчанию: false
        obfuscate: false
      # Модели для разных capabilities
      models:
        # Основная текстовая модель
        # Тип: string, По умолчанию: "gemini-2.0-flash"
        text: "gemini-2.0-flash"
        # Модель для аудиотранскрибации
        # Тип: string, По умолчанию: "gemini-2.0-flash"
        audio: "gemini-2.0-flash"
        # Модель для эмбеддингов
        # Тип: string, По умолчанию: "embedding-001"
        embed: "embedding-001"
        # Модель для анализа изображений
        # Тип: string, По умолчанию: "gemini-2.0-flash"
        image: "gemini-2.0-flash"
        # Модель для генерации изображений
        # Тип: string, По умолчанию: "gemini-2.5-flash-image-preview"
        image_gen: "gemini-2.5-flash-image-preview"
        # Модель для TTS (Gemini Text-to-Speech)
        # Тип: string, По умолчанию: "gemini-2.5-flash-preview-tts"
        tts: "gemini-2.5-flash-preview-tts"
      # Температуры для разных режимов
      temperatures:
        # Обычный режим
        # Тип: float64, По умолчанию: 1.0
        normal: 1.0
        # Серьёзный режим
        # Тип: float64, По умолчанию: 0.9
        serious: 0.9
        # Температура для аудиотранскрибации
        # Тип: float64, По умолчанию: 0.3
        audio: 0.3
        # Температура для генерации изображений
        # Тип: float64, По умолчанию: 0.7
        image: 0.7
      # Режим отладки для провайдера
      # Тип: bool, По умолчанию: false
      debug: false
      # Дополнительные параметры (произвольная карта)
      extra: {}

    # --- DeepSeek ---
    deepseek:
      # Тип: bool, По умолчанию: true
      enabled: true
      # Тип: string (secret)
      api_key: "${DEEPSEEK_API_KEY}"
      # Тип: string (secret)
      reserve_api_key: ""
      # Тип: int, По умолчанию: 0 (ротация отключена)
      key_rotation_hours: 0
      # Тип: string, По умолчанию: "https://api.deepseek.com/v1"
      base_url: "https://api.deepseek.com/v1"
      # Тип: string, По умолчанию: ""
      site_url: ""
      # Тип: string, По умолчанию: ""
      site_title: ""
      safety:
        bypass_filters: false
        obfuscate: false
      models:
        # Тип: string, По умолчанию: "deepseek-chat"
        text: "deepseek-chat"
      temperatures: {}
      # Тип: bool, По умолчанию: false
      debug: false
      extra: {}

    # --- OpenRouter ---
    openrouter:
      # Тип: bool, По умолчанию: true
      enabled: true
      # Тип: string (secret)
      api_key: "${OPENROUTER_API_KEY}"
      # Тип: string (secret)
      reserve_api_key: ""
      # Тип: int, По умолчанию: 0 (ротация отключена)
      key_rotation_hours: 0
      # Тип: string, По умолчанию: "https://openrouter.ai/api/v1"
      base_url: "https://openrouter.ai/api/v1"
      # HTTP-Referer для OpenRouter
      # Тип: string, По умолчанию: ""
      site_url: ""
      # X-Title для OpenRouter
      # Тип: string, По умолчанию: "Luna Bot"
      site_title: "Luna Bot"
      safety:
        bypass_filters: false
        obfuscate: false
      models:
        # Тип: string, По умолчанию: "deepseek/deepseek-chat-v3.1:free"
        text: "deepseek/deepseek-chat-v3.1:free"
      temperatures: {}
      # Тип: bool, По умолчанию: false
      debug: false
      extra: {}

    # --- ChatGPT / OpenAI (опционально) ---
    chatgpt:
      # Тип: bool, По умолчанию: false
      enabled: false
      # Тип: string (secret)
      api_key: "${OPENAI_API_KEY}"
      reserve_api_key: ""
      key_rotation_hours: 0
      base_url: "https://api.openai.com/v1"
      site_url: ""
      site_title: ""
      safety:
        bypass_filters: false
        obfuscate: false
      models:
        # Тип: string, По умолчанию: "gpt-4o"
        text: "gpt-4o"
        # Тип: string, По умолчанию: "dall-e-3"
        image_gen: "dall-e-3"
      temperatures: {}
      debug: false
      extra: {}

    # --- Локальные модели через OpenAI-совместимый API (Ollama / LM Studio) ---
    local:
      # Тип: bool, По умолчанию: false
      enabled: false
      api_key: ""
      reserve_api_key: ""
      key_rotation_hours: 0
      # Тип: string, По умолчанию: "http://localhost:11434/v1"
      base_url: "http://localhost:11434/v1"
      site_url: ""
      site_title: ""
      safety:
        bypass_filters: false
        obfuscate: false
      models:
        # Тип: string, По умолчанию: "llama3.1:8b"
        text: "llama3.1:8b"
        # Тип: string, По умолчанию: "nomic-embed-text"
        embed: "nomic-embed-text"
      temperatures: {}
      debug: false
      extra: {}

  # ------------------------------------------------------------------------
  # response_types — маршрутизация «ResponseType → (Provider, Model, Temperature)»
  # ------------------------------------------------------------------------
  response_types:
    # --- Базовые типы ---
    default:
      # Провайдер (gemini | deepseek | openrouter | chatgpt | local)
      # Тип: string, По умолчанию: "gemini"
      provider: "gemini"
      # Модель (переопределяет models.text провайдера, если задано)
      # Тип: string, По умолчанию: "" (использовать модель провайдера)
      model: ""
      # Температура [0.0, 2.0]
      # Тип: float64, По умолчанию: 1.0
      temperature: 1.0
      # Резервный провайдер при отказе основного
      # Тип: string, По умолчанию: "deepseek"
      fallback_provider: "deepseek"
      # Приоритет (чем меньше, тем выше)
      # Тип: int, По умолчанию: 0
      priority: 0

    direct:
