    # --- AutoBio ---
    auto_bio:
      provider: "local"
      model: ""
      temperature: 0.6
      fallback_provider: ""
      priority: 0

    auto_bio_update:
      provider: "local"
      model: ""
      temperature: 0.6
      fallback_provider: ""
      priority: 0

    # --- Personality ---
    personality_analysis:
      provider: "local"
      model: ""
      temperature: 0.5
      fallback_provider: ""
      priority: 0

    personality_name:
      provider: "local"
      model: ""
      temperature: 0.3
      fallback_provider: ""
      priority: 0

    personality_topic:
      provider: "local"
