server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: luna_bot-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: luna_bot
          host: localhost
          __path__: /var/log/luna_bot/*.log

  # Docker container log discovery отключён из-за несовместимости версий API.
  # Логи собираются через файловый static_config выше.
